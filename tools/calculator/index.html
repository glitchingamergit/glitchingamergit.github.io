<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="scripts/style.css">
    <link rel="shortcut icon" href="Resources/favicon.ico">

    <style>

        .top-left-button {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            font-size: 12px;
            background-color: aliceblue;
            color: black;
            border-radius: 4px;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            width: fit-content;
            height: fit-content;
            border-color: black;
        }

        .top-left-button:hover {
            transform: scale(1.1);
        }

        .top-left-button:active {
            transform: scale(0.95);
        }

        #hint {
            position: fixed;
            color: white;
            bottom: 10px;
            right: 10px;
            font-size: large;
        }

        @media (prefers-color-scheme: dark) {
            .top-left-button {
                background-color: #333333;
                color: #ffffff;
            }
        }

    </style>
</head>
<body>
    <button class="top-left-button" onclick="history.back()">Back</button>
    <div class="container">
        <div class="calculator">
            <input type="text" id="inputBox" placeholder="0" readonly/>
            <div>
                <button class="button operator">AC</button>
                <button class="button operator">DEL</button>
                <button class="button operator">/</button>
                <button class="button operator">^</button>
            </div>
            <div>
                <button class="button">7</button>
                <button class="button">8</button>
                <button class="button">9</button>
                <button class="button operator">*</button>
            </div>
            <div>
                <button class="button">4</button>
                <button class="button">5</button>
                <button class="button">6</button>
                <button class="button operator">-</button>
            </div>
            <div>
                <button class="button">1</button>
                <button class="button">2</button>
                <button class="button">3</button>
                <button class="button operator">+</button>
            </div>
            <div>
                <button class="button">0</button>
                <button class="button">.</button>
                <button class="button equalBtn">=</button>
                <button class="button" id="copy" onclick="copyTextToClipboard()"><img src="Resources/copy.png" width="25px"></button>
            </div>
        </div>
    </div>
    <p id="hint">Hint: You can use the keyboard to enter the numbers (Sadly not the enter/return key nor the operators because it messes things up).</p>

    <script>
        if (window.location.href.includes("index.html")) window.open(".", "_self");
    </script>
    <script src="scripts/script.js"></script>
</body>
</html>
