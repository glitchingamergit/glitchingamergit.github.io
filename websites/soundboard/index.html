<!DOCTYPE html>
<html>
<head>
    <title>Soundboard</title>
    <link rel="stylesheet" href="../../asset/src/style.css">
    <link rel="stylesheet" href="../../asset/src/IndentPages.css">
    <link rel="shortcut icon" href="Resources/favicon.ico" type="image/x-icon">

    <style>

        .top-left-button {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 5px 10px;
            font-size: 12px;
            background-color: aliceblue;
            border-radius: 4px;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s ease-in-out;
            width: fit-content;
            height: fit-content;
            border-color: black;
        }

        .top-left-button:hover {
            transform: scale(1.1);
        }

        .top-left-button:active {
            transform: scale(0.95);
        }

        @media (prefers-color-scheme: dark) {
            .top-left-button {
                background-color: #333333;
                color: #ffffff;
            }
        }

    </style>
</head>
<body>
    <a href="../../"><button class="top-left-button crewmate">Back</button></a>
    <h1 class="notCrewmate">Please interact with the website!</h1>
    <h1>Welcome to my Soundboard</h1>
    <button id="stopButton" class="indent TopIndent" onclick="StopAllSounds()">Stop All Playing Sounds</button>
    <p>Click a button to play a sound!</p>

        <button id="sound2" class="indent TopIndent">Bruh</button>

        <button id="sound8" class="indent TopIndent">Discord Ringtone</button>
        <button id="sound9" class="indent TopIndent">Duck Toy Squeak</button>
        <button id="sound10" class="indent TopIndent">Emotional Damage</button>
        <button id="sound11" class="indent TopIndent">Explosion</button>
        <button id="sound12" class="indent TopIndent">Failure</button>
        <button id="sound13" class="indent TopIndent">FBI Open Up</button>
        <button id="sound14" class="indent TopIndent">Get Out</button>
        <button id="sound15" class="indent TopIndent">Hold Up Wait a Minute Something Aint Right</button>
        <button id="sound16" class="indent TopIndent">Huh</button>

        <button id="sound28" class="indent TopIndent">Stupid</button>
        <button id="sound29" class="indent TopIndent">What</button>
    </div>
    <button class="bottom-right-button" onclick="PlayAllSounds()">Play all sounds <strong style="color: red;">(VOLUME WARNING)</strong> 💀💀💀</button>

    <script>
        if (window.location.href.includes("index.html")) window.open(".", "_self");
    </script>
    <script src="scripts/PlaySoundUsingSoundboard.js"></script>
