<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../asset/src/style.css">
    <link rel="shortcut icon" href="Resources/favicon.ico" type="image/x-icon">
    <title>Web Generator</title>

    <style>

        #RandomButton {
            margin-top: 25pc;
            background-color: red;
        }

        #site-button {
            color: black;
            position: fixed;
            bottom: 10px;
            right: 10px;
        }

        @media (prefers-color-scheme: dark) {
            #site-button {
                color: white;
            }

            #RandomButton {
                margin-top: 25pc;
                background-color: rgb(255, 41, 83);
                border-color: rgb(255, 41, 32);
            }
        }

    </style>
</head>
<body>
    <a href="../../"><button class="top-left-button">Back</button></a>

    <button id="RandomButton" onclick="showRandomWebsite()">Show Random Link</button>
    <a id="linkForButton" href="" target="_blank"><h2 id="output"></h2></a>
    
    <a href="sites.json"><button id="site-button">Full list of websites</button></a>

    <script>
        if (window.location.href.includes("index.html")) window.open(".", "_self");
    </script>

    <script src="Resources/script.js"></script>
</body>
</html>
