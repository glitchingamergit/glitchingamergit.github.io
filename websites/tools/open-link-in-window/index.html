<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <script>

        const args = window.location.search;
        const searchParams = new URLSearchParams(args);

        if (searchParams.get('link')) {
            window.open(`/tools/open-link-in-window/?link=${searchParams.get('link')}`, "_self");
        } else {
            window.open(`/tools/open-link-in-window/`, "_self");
        }

    </script>

</head>
</html>
