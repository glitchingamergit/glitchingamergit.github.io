<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../asset/src/style.css">
    <link rel="stylesheet" href="/asset/src/IndentPages.css">
    <link rel="shortcut icon" href="asset/src/favicon.ico" type="image/x-icon">

    <style>

        button#compliments-and-insults {
            background-image: url(asset/web-icon/compliment_insult_light.png);
            color: white;
        }

        button#calculator {
            background-image: url(asset/web-icon/calculator.png);
            color: white;
        }

        button#day {
            color: white;
            background-image: url(asset/web-icon/days-day-light.png);
        }

        button#pdf {
            background-image: url(asset/web-icon/math.png);
            color: rgb(127, 127, 127);
            padding: 5px 10px;
            cursor: not-allowed;
        }

        button#pdf:hover {
            transform: scale(1);
        }

        button#sound {
            background-image: url(asset/web-icon/soundboard_light.png);
            color: white;
        }

        @media (prefers-color-scheme: dark) {
            button#compliments-and-insults {
                background-image: url(asset/web-icon/compliment_insult_dark.png);
            }

            button#day {
                background-image: url(asset/web-icon/days-day-dark.png);
            }

            button#pdf {
                border-color: darkgrey;
            }

            button#sound {
                background-image: url(asset/web-icon/soundboard_dark.png);
            }
        }

    </style>
</head>
<body>
    <h1 id="welcome"></h1>
    <a href="./deprecated-websites/old-math-website/"><button style="position: fixed; bottom: 10px; left: 40px; z-index: 9999; padding: 0% 0%;">Go to Recovered Site</button></a>
    <p style="position: fixed; bottom: 40px; left: 80px; z-index: 9999;">Math Website is recovered and back!!!<p style="text-decoration: line-through; position: fixed; bottom: 60px; left: 0x; z-index: 9999;">RIP Math Website Late 2024 - 8 Feb. 2026 @ 20:32 UTC</p></p>
    <h1>Please click on the available website below:</h1>
    <a href="./websites/calculator/"><button id="calculator">Calculator</button></a>
    <a href="./websites/compliments-and-insults/"><button id="compliments-and-insults">Compliments & Insults</button></a>
    <a href="./websites/days-until-day/"><button id="day">Days Until Day</button></a>
    <a href="./websites/facts/"><button id="fact">Facts</button></a>
    <a href="./websites/soundboard/"><button id="sound">Soundboard</button></a>
    <a href="./websites/recover-links/"><button id="links">"Recoverlinks.com"</button></a>
    <a href="./websites/randomizer/"><button id="random">Website Randomizer</button></a>

    <h1>Deprecated:</h1>
    <button id="pdf" title="Deprecated as of 8 Mar. 2026, 17:22 UTC">Math PDF Files</button>

    <script>
        console.log("Navya is a Bandar!");

        let welcomeText = document.getElementById("welcome");
        let url = window.location.href;

        if (url != null) {
            if (url.includes("https://")) {
                url = url.replace("https://", "");
            } else if (url.includes("http://")) {
                url = url.replace("http://", "");
            }

            // List of if-statements
            if (url.includes("/")) url = url.replace("/", "");
            if (url.includes("index.html")) window.open(".", "_self");

            welcomeText.textContent = `Welcome to ${url}`;
        }


        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);

        if (urlParams.get('p') !== null) {
            if (urlParams.get('p').toLowerCase() === 'rr') {
                const newWindow = window.open("https://www.youtube.com/watch?v=QDia3e12czc", "_self");

                if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                    alert("Popup blocked! Please allow popups or use the link on the page.");
                }
            }
        }
        
        let websiteShortcut = urlParams.get('w');
        if (websiteShortcut != null) websiteShortcut = websiteShortcut.toLowerCase();

        // List of shortcuts you can use to access website more easily!
        // Just put '?w=[case value]' (no single-quote) to the end of the URL to access them (NOT CASE-SENSITIVE)!
        switch (websiteShortcut) {
            case "calculator":
                window.open("./websites/calculator/", "_self");
                break;
            case "sb":
            case "soundboard":
                if (urlParams.get('i') !== null) {
                    window.open(`./websites/soundboard/?i=${urlParams.get('i').toLowerCase()}`, "_self");
                    break;
                }
                window.open(`./websites/soundboard/`, "_self");
                break;
            case "recover":
            case "recover-links":
            case "links":
                window.open("./websites/recover-links/", "_self");
                break;
            case "random":
            case "random-links":
            case "random-link":
            case "randomizer":
                window.open("./websites/randomizer/", "_self");
                break;
            case "ci":
            case "compliment":
            case "compliments":
            case "insult":
            case "insults":
            case "compliment and insult":
            case "compliments and insult":
            case "compliment and insults":
            case "compliments and insults":
                if (urlParams.get('message') !== null) {
                    window.open(`./websites/compliments-and-insults/?message=${urlParams.get('message')}`, "_self");
                    break;
                } else if (urlParams.get('m') !== null) {
                    window.open(`./websites/compliments-and-insults/?m=${urlParams.get('m')}`, "_self");
                    break;
                }

                window.open(`./websites/compliments-and-insults/`, "_self");
                break;
            case "day":
            case "days":
            case "until":
            case "day until days":
            case "day until day":
            case "days until date":
            case "day until date":
                window.open("./websites/days-until-day/", "_self");
                break;
        }

    </script>
    <div class="button-brothers">
        <a href="credits/"><button class="small-button">Credits</button></a>
        <a href="about-the-developer/"><button class="small-button">About the Developer</button></a>
    </div>
</body>
</html>
